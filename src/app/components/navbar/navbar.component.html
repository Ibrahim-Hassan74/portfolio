@if (mobileOpen()) {
  <!-- Darkened Blur Backdrop for Mobile Menu -->
  <div
    (click)="closeMobile()"
    class="animate-mobile-backdrop fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden"
    aria-hidden="true"
  ></div>
}

<header
  #header
  class="fixed top-3 sm:top-4 inset-x-0 z-50 mx-auto max-w-6xl px-3 sm:px-6"
>
  <nav
    class="flex h-14 sm:h-16 items-center justify-between rounded-2xl border border-border-subtle px-3.5 sm:px-6 shadow-xl backdrop-blur-xl"
    style="background-color: var(--nav-solid);"
    aria-label="Main navigation"
  >
    <button
      type="button"
      (click)="scrollTo('hero')"
      class="flex items-center gap-2.5 text-base sm:text-lg font-extrabold tracking-tight text-text-primary transition-colors hover:text-accent"
    >
      <span class="flex h-8 w-8 items-center justify-center rounded-lg btn-aurora font-mono text-xs sm:text-sm font-black text-white">
        IH
      </span>
      <span>Ibrahim<span class="text-accent">.</span>dev</span>
    </button>

    <div class="hidden items-center gap-1 rounded-xl border border-border-subtle bg-elevated p-1 lg:flex">
      @for (link of links; track link.id) {
        <button
          type="button"
          (click)="scrollTo(link.id)"
          class="relative rounded-lg px-3.5 py-1.5 text-xs font-semibold transition-all sm:text-sm"
          [class.bg-accent]="activeSection() === link.id"
          [class.text-white]="activeSection() === link.id"
          [class.shadow-sm]="activeSection() === link.id"
          [class.text-text-secondary]="activeSection() !== link.id"
          [class.hover:text-text-primary]="activeSection() !== link.id"
        >
          {{ link.label }}
        </button>
      }
    </div>

    <div class="hidden items-center gap-2.5 lg:flex">
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isLightMode() ? 'Switch to dark mode' : 'Switch to light mode'"
        title="Toggle Light / Dark Mode"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-border-subtle bg-elevated text-text-primary transition-transform hover:scale-105 hover:border-accent hover:text-accent"
      >
        <lucide-icon [name]="isLightMode() ? 'moon' : 'sun'" [size]="18" />
      </button>
      <a
        [href]="cv"
        download
        class="inline-flex items-center gap-2 rounded-xl border border-border-subtle bg-elevated px-4 py-2 text-xs font-semibold text-text-primary transition-all hover:border-accent hover:text-accent sm:text-sm"
      >
        <lucide-icon name="download" [size]="15" />
        CV
      </a>
      <button
        type="button"
        (click)="scrollTo('contact')"
        class="btn-aurora inline-flex items-center gap-2 rounded-xl px-4 py-2 text-xs font-bold text-white sm:text-sm"
      >
        Hire Me
      </button>
    </div>

    <div class="flex items-center gap-2 lg:hidden">
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isLightMode() ? 'Switch to dark mode' : 'Switch to light mode'"
        class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-border-subtle bg-elevated text-text-primary transition-transform active:scale-90 hover:border-accent hover:text-accent"
      >
        <lucide-icon [name]="isLightMode() ? 'moon' : 'sun'" [size]="17" />
      </button>
      <button
        type="button"
        (click)="toggleMobile()"
        class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-border-subtle bg-elevated text-text-primary transition-all duration-300 active:scale-90 hover:border-accent hover:text-accent"
        [class.border-accent]="mobileOpen()"
        [class.text-accent]="mobileOpen()"
        [class.rotate-90]="mobileOpen()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Toggle navigation menu"
      >
        <lucide-icon [name]="mobileOpen() ? 'x' : 'menu'" [size]="20" />
      </button>
    </div>
  </nav>

  @if (mobileOpen()) {
    <div 
      class="animate-mobile-panel mt-2.5 overflow-hidden rounded-2xl border border-border-subtle p-4 shadow-2xl lg:hidden"
      style="background-color: var(--nav-solid);"
    >
      <div class="animate-mobile-item mb-2 px-2 font-mono text-[10px] font-bold uppercase tracking-widest text-text-muted" style="animation-delay: 20ms;">
        Navigation
      </div>

      <div class="flex flex-col gap-1.5">
        @for (link of links; track link.id; let i = $index) {
          <button
            type="button"
            (click)="scrollTo(link.id)"
            [style.animation-delay.ms]="50 + i * 45"
            class="animate-mobile-item group flex items-center justify-between rounded-xl px-4 py-3 text-left text-sm font-bold transition-all active:scale-98"
            [class.btn-aurora]="activeSection() === link.id"
            [class.text-white]="activeSection() === link.id"
            [class.bg-elevated]="activeSection() !== link.id"
            [class.text-text-secondary]="activeSection() !== link.id"
            [class.hover:text-text-primary]="activeSection() !== link.id"
          >
            <span>{{ link.label }}</span>
            <lucide-icon name="chevron-right" [size]="16" class="transition-transform duration-200 group-hover:translate-x-1" />
          </button>
        }
      </div>

      <div
        class="animate-mobile-item mt-4 grid grid-cols-2 gap-2.5 border-t border-border-subtle pt-4"
        style="animation-delay: 280ms;"
      >
        <a
          [href]="cv"
          download
          class="inline-flex items-center justify-center gap-2 rounded-xl border border-border-subtle bg-elevated px-3 py-3 text-xs font-bold text-text-primary transition-colors hover:border-accent hover:text-accent"
        >
          <lucide-icon name="download" [size]="16" />
          Download CV
        </a>
        <button
          type="button"
          (click)="scrollTo('contact')"
          class="btn-aurora inline-flex items-center justify-center gap-2 rounded-xl px-3 py-3 text-xs font-bold text-white"
        >
          <lucide-icon name="mail" [size]="16" />
          Hire Me
        </button>
      </div>

      <div
        class="animate-mobile-item mt-3 flex items-center justify-between rounded-xl border border-border-subtle bg-elevated px-4 py-2.5"
        style="animation-delay: 330ms;"
      >
        <span class="font-mono text-[11px] font-semibold text-text-muted">Connect</span>
        <div class="flex items-center gap-3">
          <a
            [href]="contact.github"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            class="text-text-secondary transition-transform hover:scale-110 hover:text-accent"
          >
            <lucide-icon name="github" [size]="18" />
          </a>
          <a
            [href]="contact.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            class="text-text-secondary transition-transform hover:scale-110 hover:text-accent"
          >
            <lucide-icon name="linkedin" [size]="18" />
          </a>
          <a
            [href]="'mailto:' + contact.email"
            aria-label="Email"
            class="text-text-secondary transition-transform hover:scale-110 hover:text-accent"
          >
            <lucide-icon name="mail" [size]="18" />
          </a>
        </div>
      </div>
    </div>
  }
</header>
